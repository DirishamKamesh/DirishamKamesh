<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 370" width="100%" height="370">
  <defs>
    <style>

        @keyframes rowReveal {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes neonGlow {
            0%, 100% { fill: #39d353; filter: drop-shadow(0 0 2px rgba(57, 211, 83, 0.4)); }
            50% { fill: #58a6ff; filter: drop-shadow(0 0 4px rgba(88, 166, 255, 0.6)); }
        }
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; rx: 10px; }
        .topbar { fill: #161b22; rx: 10px; }
        .topbar-divider { stroke: #30363d; stroke-width: 1px; }
        .dot-red { fill: #ff5f56; }
        .dot-yellow { fill: #ffbd2e; }
        .dot-green { fill: #27c93f; }
        .title { fill: #8b949e; font-family: 'Fira Code', Consolas, monospace; font-size: 13px; font-weight: 600; }

        .ascii-row {
            font-family: 'Fira Code', Consolas, 'Courier New', monospace;
            font-size: 6px;
            fill: #39d353;
            white-space: pre;
            opacity: 0;
            animation: rowReveal 0.3s ease-out forwards;
        }
        .ascii-highlight {
            fill: #58a6ff;
            font-weight: bold;
        }
        .ascii-tag {
            fill: #7ee787;
        }
    
    </style>
  </defs>

  <!-- Container -->
  <rect class="bg" x="1" y="1" width="378" height="368" />
  
  <!-- Header -->
  <rect class="topbar" x="1" y="1" width="378" height="36" />
  <line class="topbar-divider" x1="1" y1="36" x2="379" y2="36" />
  <circle class="dot-red" cx="18" cy="18" r="6" />
  <circle class="dot-yellow" cx="38" cy="18" r="6" />
  <circle class="dot-green" cx="58" cy="18" r="6" />
  <text class="title" x="190.0" y="22" text-anchor="middle">dirisham@ascii-portrait ~ terminal</text>

